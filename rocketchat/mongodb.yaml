# Rocket.Chat only supports MongoDB running as a replica set (it tails the
# oplog / change streams), so even this single node has to be an initiated
# one-member "rs0" -- hence the StatefulSet + headless Service, which give
# the member the stable DNS name the replica set config records.
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: rocketchat
spec:
  clusterIP: None
  selector:
    app: mongodb
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: rocketchat
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:8.0.28
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_KEYFILE
              valueFrom:
                secretKeyRef:
                  name: rocketchat
                  key: mongodb-keyfile
            - name: MONGO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rocketchat
                  key: mongodb-root-password
          # A replica set with authorization enabled also needs internal
          # (member-to-member) auth, i.e. a keyFile -- and mongod rejects a
          # keyFile that is group- or world-readable. Secret volume files are
          # owned by root and can't be chmod'd in place, so the key is
          # materialized here instead, with the ownership/mode mongod wants,
          # before handing off to the image's own entrypoint.
          command:
            - bash
            - -c
            - |
              set -eu
              umask 077
              printf '%s' "$MONGO_KEYFILE" > /keyfile/keyfile
              chown 999:999 /keyfile/keyfile
              chmod 400 /keyfile/keyfile
              exec docker-entrypoint.sh mongod \
                --replSet rs0 \
                --bind_ip_all \
                --auth \
                --keyFile /keyfile/keyfile
          lifecycle:
            postStart:
              exec:
                command:
                  - bash
                  - -c
                  - |
                    set -eu
                    deadline=$(( $(date +%s) + 300 ))
                    timeout_check() {
                      if [ "$(date +%s)" -gt "$deadline" ]; then
                        echo "timed out: $1" >&2
                        exit 1
                      fi
                    }

                    until mongosh --quiet --eval 'db.adminCommand({ ping: 1 })' >/dev/null 2>&1; do
                      timeout_check "waiting for mongod to accept connections"
                      sleep 3
                    done

                    # Both mongosh calls below rely on MongoDB's localhost
                    # exception, which only applies while the deployment has
                    # no users at all -- that is, exactly once, on the first
                    # boot of an empty data directory. On every later start
                    # they're rejected (already initialized / unauthorized),
                    # which is the expected no-op, hence the tolerated errors.
                    mongosh --quiet --eval '
                      rs.initiate({
                        _id: "rs0",
                        members: [{ _id: 0, host: "mongodb-0.mongodb.rocketchat.svc.cluster.local:27017" }],
                      })
                    ' || true

                    # createUser is a write, so it has to wait out the
                    # election -- until this node is primary it is rejected.
                    until mongosh --quiet --eval 'db.hello().isWritablePrimary' 2>/dev/null | grep -qx true; do
                      timeout_check "waiting for this node to become primary"
                      sleep 3
                    done

                    mongosh --quiet --eval '
                      db.getSiblingDB("admin").createUser({
                        user: "root",
                        pwd: process.env.MONGO_ROOT_PASSWORD,
                        roles: ["root"],
                      })
                    ' || true
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
            - name: keyfile
              mountPath: /keyfile
      volumes:
        - name: mongodb-data
          persistentVolumeClaim:
            claimName: mongodb-data
        - name: keyfile
          emptyDir:
            medium: Memory
