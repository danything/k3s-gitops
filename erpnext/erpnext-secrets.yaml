# Secret erpnext (admin-password / mariadb-root-password / oidc-client-secret /
# smtp-password) は Infisical (il.doany.io) が持ち、External Secrets Operator が
# フォルダ /erpnext/erpnext の中身をそのままキーにして作る。値の変更は Infisical 側で行う
# (README の Secret の項)。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: erpnext
  namespace: erpnext
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: erpnext
  dataFrom:
    - find:
        path: /erpnext/erpnext
        name:
          regexp: .*
