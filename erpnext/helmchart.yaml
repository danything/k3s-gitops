apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: erpnext
  namespace: kube-system
spec:
  chart: erpnext
  repo: https://helm.erpnext.com
  version: 8.0.15
  targetNamespace: erpnext
  createNamespace: true
  values:
    image:
      tag: version-15

    # Externally-managed PVC (see pvc.yaml) so site data survives even if
    # this release ever gets uninstalled/reinstalled by the helm-controller.
    persistence:
      worker:
        existingClaim: erpnext-sites

    # rootPassword intentionally omitted: the chart only auto-creates its
    # Secret (named "erpnext", key mariadb-root-password) when this value is
    # set, so leaving it unset lets the SealedSecret-managed Secret of the
    # same name/key (erpnext-secrets-sealed.yaml) provide it instead.
    mariadb-sts:
      enabled: true
      persistence:
        storageClass: local-path-retain

    # chart has no mariadb-sts branch for DB_ROOT_USER, falls back to this
    dbRootUser: root

    jobs:
      createSite:
        enabled: true
        siteName: n.doany.io
        adminExistingSecret: erpnext
        adminExistingSecretKey: admin-password

      # Declarative equivalent of gitlab/omnibus_config.rb's OIDC block:
      # (re)creates the Microsoft Entra ID Social Login Key on every deploy,
      # since ERPNext keeps this in the site DB rather than a mountable
      # config file. Also grants info@doany.io (the designated admin) every
      # role, and promotes any other self-signed-up account to a normal
      # operational member (Sales/Purchase/Accounts/Stock User, no manager
      # or System Manager access). If the DB is ever wiped, this job
      # recreates all of it from here.
      # NOTE: Job specs are immutable - if you edit the script below,
      # `kubectl delete job erpnext-setup-oidc -n erpnext` before reapplying.
      custom:
        enabled: true
        jobName: erpnext-setup-oidc
        restartPolicy: Never
        volumes:
          - name: sites-dir
            persistentVolumeClaim:
              claimName: erpnext-sites
        containers:
          - name: setup-oidc
            image: frappe/erpnext:version-15
            env:
              - name: OIDC_CLIENT_SECRET
                valueFrom:
                  secretKeyRef:
                    name: erpnext
                    key: oidc-client-secret
            volumeMounts:
              - name: sites-dir
                mountPath: /home/frappe/frappe-bench/sites
            command:
              - bash
              - -c
              - |
                export start=`date +%s`
                until [ -f sites/n.doany.io/site_config.json ]; do
                  echo "waiting for n.doany.io site to be created"
                  sleep 10
                  if (( `date +%s`-start > 900 )); then
                    echo "timed out waiting for site"
                    exit 1
                  fi
                done
                bench --site n.doany.io set-config host_name https://n.doany.io
                cat <<'PYEOF' | bench --site n.doany.io console
                import os
                frappe.set_user("Administrator")

                name = frappe.scrub("Microsoft Entra ID")
                if frappe.db.exists("Social Login Key", name):
                    doc = frappe.get_doc("Social Login Key", name)
                else:
                    doc = frappe.new_doc("Social Login Key")
                    doc.provider_name = "Microsoft Entra ID"

                doc.social_login_provider = "Custom"
                doc.enable_social_login = 1
                doc.custom_base_url = 0
                doc.client_id = "b0fa498f-7e6a-4fe1-a1c6-16fbbb6f397e"
                doc.client_secret = os.environ["OIDC_CLIENT_SECRET"]
                doc.base_url = "https://login.microsoftonline.com/22ac977d-b140-4dc8-8150-90d645d3475b"
                doc.authorize_url = "https://login.microsoftonline.com/22ac977d-b140-4dc8-8150-90d645d3475b/oauth2/v2.0/authorize"
                doc.access_token_url = "https://login.microsoftonline.com/22ac977d-b140-4dc8-8150-90d645d3475b/oauth2/v2.0/token"
                doc.api_endpoint = "https://graph.microsoft.com/oidc/userinfo"
                doc.redirect_url = "/api/method/frappe.integrations.oauth2_logins.custom/" + name
                doc.auth_url_data = frappe.as_json({"response_type": "code", "scope": "openid profile email"})
                doc.sign_ups = "Allow"
                doc.save(ignore_permissions=True)

                from frappe.utils.oauth import update_oauth_user
                frappe.set_user("Guest")
                data = {"sub": "info-doany-manual", "email": "info@doany.io", "name": "Info Doany", "given_name": "Info", "family_name": "Doany", "preferred_username": "info@doany.io"}
                update_oauth_user("info@doany.io", data, name)

                frappe.set_user("Administrator")
                user = frappe.get_doc("User", "info@doany.io")
                user.user_type = "System User"
                user.enabled = 1
                for role_name in frappe.get_all("Role", filters={"disabled": 0}, pluck="name"):
                    if role_name in ("Guest", "All"):
                        continue
                    user.add_roles(role_name)
                user.save(ignore_permissions=True)

                # Any other account that self-signs-up via OIDC (not the
                # designated admin above) gets a normal operational member
                # role set, not admin/manager access.
                member_roles = ["Sales User", "Purchase User", "Accounts User", "Stock User"]
                other_users = frappe.get_all(
                    "User",
                    filters={"name": ["not in", ["Administrator", "Guest", "info@doany.io"]], "enabled": 1},
                    pluck="name",
                )
                for uname in other_users:
                    u = frappe.get_doc("User", uname)
                    if u.user_type == "Website User":
                        u.user_type = "System User"
                    for role_name in member_roles:
                        u.add_roles(role_name)
                    u.save(ignore_permissions=True)

                frappe.db.commit()
                print("SETUP_OK", doc.name, user.name, len(user.roles), "other_users_promoted:", len(other_users))

                PYEOF
                true
