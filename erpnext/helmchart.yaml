apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: erpnext
  namespace: kube-system
spec:
  chart: erpnext
  repo: https://helm.erpnext.com
  version: 8.0.15
  targetNamespace: erpnext
  createNamespace: true
  values:
    image:
      tag: version-15

    # Externally-managed PVC (see pvc.yaml) so site data survives even if
    # this release ever gets uninstalled/reinstalled by the helm-controller.
    persistence:
      worker:
        existingClaim: erpnext-sites

    # rootPassword explicitly emptied (not omitted -- an omitted key falls
    # back to the chart's own default "changeit", which re-enables the
    # chart's auto-created Secret and collides with our externally-managed
    # one). Empty disables that Secret template, so the SealedSecret-managed
    # Secret of the same name/key (erpnext-secrets-sealed.yaml) provides it
    # instead.
    mariadb-sts:
      enabled: true
      rootPassword: ""
      persistence:
        storageClass: local-path-retain

    # chart has no mariadb-sts branch for DB_ROOT_USER, falls back to this
    dbRootUser: root

    jobs:
      createSite:
        enabled: true
        siteName: en.doany.io
        adminExistingSecret: erpnext
        adminExistingSecretKey: admin-password

    # The post-install OIDC/SMTP setup job used to live here as
    # jobs.custom, but Job specs are immutable and this chart's custom-job
    # mechanism doesn't expose an annotations field, so every edit required
    # manually deleting the Job before it could be re-applied. It's now a
    # plain manifest (job-setup-oidc.yaml) with an ArgoCD Replace=true
    # sync-option, which handles that automatically.
