# Secret 3proxy (users.cfg) は Infisical (il.doany.io) が持ち、External Secrets Operator が
# フォルダ /3proxy/3proxy の中身をそのままキーにして作る。値の変更は Infisical 側で行う
# (README の Secret の項)。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: 3proxy
  namespace: 3proxy
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: 3proxy
  dataFrom:
    - find:
        path: /3proxy/3proxy
        name:
          regexp: .*
