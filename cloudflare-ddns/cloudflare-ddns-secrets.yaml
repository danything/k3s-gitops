# Secret cloudflare-ddns-secrets は Infisical (il.doany.io) のフォルダ /cloudflare-ddns/cloudflare-ddns-secrets にあり、
# Infisical 純正 operator (bootstrap/infisical-operator) が Secret にする。
# 値は Infisical の UI で書き換えるだけ（60秒以内に同期。auto-reload 注釈のある
# Deployment は自動で入れ替わる）。
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: cloudflare-ddns-secrets
  namespace: cloudflare-ddns
spec:
  hostAPI: http://infisical.infisical.svc:8080/api
  resyncInterval: 60
  authentication:
    kubernetesAuth:
      identityId: f2bc3416-f196-4626-9bf3-c11693b32cc6
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: infisical-auth
        namespace: infisical
      secretsScope:
        projectSlug: k3s-cluster
        envSlug: prod
        secretsPath: /cloudflare-ddns/cloudflare-ddns-secrets
        recursive: false
  managedKubeSecretReferences:
    - secretName: cloudflare-ddns-secrets
      secretNamespace: cloudflare-ddns
      # Orphan: CR を消しても Secret は残す（移行や再作成で稼働中の Pod を巻き込まない）
      creationPolicy: Orphan
