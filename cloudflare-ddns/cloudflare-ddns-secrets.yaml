# Secret cloudflare-ddns-secrets (CLOUDFLARE_API_TOKEN) は Infisical (il.doany.io) が持ち、
# External Secrets Operator がフォルダ /cloudflare-ddns/cloudflare-ddns-secrets の中身を
# そのままキーにして作る。値の変更は Infisical 側で行う (README の Secret の項)。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-ddns-secrets
  namespace: cloudflare-ddns
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: cloudflare-ddns-secrets
  dataFrom:
    - find:
        path: /cloudflare-ddns/cloudflare-ddns-secrets
        name:
          regexp: .*
