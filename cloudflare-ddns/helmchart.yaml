apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: cloudflare-ddns
  namespace: kube-system
spec:
  chart: oci://ghcr.io/timothymiller/cloudflare-ddns
  version: 0.1.0
  targetNamespace: cloudflare-ddns
  values:
    # API token comes from the SealedSecret-managed Secret
    # (cloudflare-ddns-secrets-sealed.yaml), key CLOUDFLARE_API_TOKEN.
    cloudflare:
      existingSecret: cloudflare-ddns-secrets

    # Every ingress host with real A/AAAA records here. l/ts/w/x are CNAMEs
    # to doany.io in Cloudflare (the API refuses A/AAAA next to a CNAME), so
    # they follow automatically and must not be listed.
    domains: >-
      doany.io,a.doany.io,ak.doany.io,c.doany.io,d.doany.io,en.doany.io,mm.doany.io,n.doany.io,p.doany.io,wg.doany.io

    # Only the apex stays behind the Cloudflare proxy; the subdomains
    # resolve directly to us.
    proxied: "is(doany.io)"

    # AAAA should be bond0's static ::2 (also the k3s node IP), not whatever
    # source address an outbound probe happens to pick. This provider reads
    # the interface and skips temporary/deprecated addresses.
    ip6Provider: local.iface.stable:bond0
