apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: cloudflare-ddns
  namespace: kube-system
spec:
  chart: oci://ghcr.io/timothymiller/cloudflare-ddns
  version: 0.1.0
  targetNamespace: cloudflare-ddns
  values:
    # API token comes from the SealedSecret-managed Secret
    # (cloudflare-ddns-secrets-sealed.yaml), key CLOUDFLARE_API_TOKEN.
    cloudflare:
      existingSecret: cloudflare-ddns-secrets

    # Every ingress host that points at this house, DNS-only and proxied
    # alike -- proxied records still carry an origin IP that must track us.
    domains: >-
      doany.io,a.doany.io,ak.doany.io,c.doany.io,d.doany.io,en.doany.io,l.doany.io,mm.doany.io,n.doany.io,p.doany.io,ts.doany.io,w.doany.io,wg.doany.io,x.doany.io

    # Which of those stay behind the Cloudflare proxy (matches the state
    # observed in DNS on 2026-08-24); the rest resolve directly to us.
    proxied: "is(doany.io) || is(l.doany.io) || is(ts.doany.io) || is(w.doany.io) || is(x.doany.io)"

    # AAAA should be bond0's static ::2 (also the k3s node IP), not whatever
    # source address an outbound probe happens to pick. This provider reads
    # the interface and skips temporary/deprecated addresses.
    ip6Provider: local.iface.stable:bond0
