apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: mosp
  namespace: kube-system
spec:
  chart: oci://ghcr.io/danything/charts/mosp
  version: 0.3.1
  targetNamespace: mosp
  createNamespace: true
  values:
    # The image tag stays at latest (MosP itself only moves about once a
    # year, and helm-mosp's workflow re-points latest), so a re-created Pod
    # has to re-pull instead of reusing whatever the node cached.
    image:
      pullPolicy: Always

    ingress:
      enabled: true
      host: mp.doany.io
      certResolver: mydnschallenge

    persistence:
      storageClassName: local-path-retain

    # Externally-managed via SealedSecret (see mosp-secrets-sealed.yaml) so
    # the password survives even if this release ever gets uninstalled and
    # reinstalled by the helm-controller.
    postgresql:
      existingSecret: mosp-secrets
