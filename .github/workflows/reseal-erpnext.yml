name: Reseal erpnext secrets

# 平文の値は GitHub Secrets 側にだけ置く。pub-cert.pem (sealed-secrets
# コントローラーの公開鍵、非秘密なのでコミット済み) で kubeseal し、結果の
# SealedSecret だけをコミットする。値を変えたら Secrets を更新してこの
# ワークフローを再実行する。鍵のローテーションは bootstrap/fetch-cert.sh 参照。
#
# このリポジトリは複数アプリの Secret を持つので、キー名は ERPNEXT_ プレフィックス。
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  reseal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Seal erpnext
        env:
          SEAL_DATA: |
            {
              "admin-password": ${{ toJSON(secrets.ERPNEXT_ADMIN_PASSWORD) }},
              "mariadb-root-password": ${{ toJSON(secrets.ERPNEXT_MARIADB_ROOT_PASSWORD) }},
              "oidc-client-secret": ${{ toJSON(secrets.ERPNEXT_OIDC_CLIENT_SECRET) }},
              "smtp-password": ${{ toJSON(secrets.ERPNEXT_SMTP_PASSWORD) }}
            }
        run: |
          set -eu
          WORKDIR="$(mktemp -d)"
          trap 'rm -rf "$WORKDIR"' EXIT

          if ! command -v kubeseal >/dev/null 2>&1; then
            curl -sfL -o "$WORKDIR/kubeseal.tar.gz" \
              "https://github.com/bitnami/sealed-secrets/releases/download/v0.38.4/kubeseal-0.38.4-linux-amd64.tar.gz"
            tar -xzf "$WORKDIR/kubeseal.tar.gz" -C "$WORKDIR" kubeseal
            sudo install -m 0755 "$WORKDIR/kubeseal" /usr/local/bin/kubeseal
          fi

          python3 - "$WORKDIR/plain.yaml" <<'PYEOF'
          import base64, json, os, sys
          data = json.loads(os.environ["SEAL_DATA"])
          with open(sys.argv[1], "w") as f:
              f.write("apiVersion: v1\nkind: Secret\nmetadata:\n")
              f.write("  name: erpnext\n  namespace: erpnext\n")
              f.write("type: Opaque\ndata:\n")
              for key, value in data.items():
                  b64 = base64.b64encode(value.encode()).decode()
                  f.write(f"  {json.dumps(key)}: {b64}\n")
          PYEOF

          kubeseal --cert pub-cert.pem --format yaml \
            < "$WORKDIR/plain.yaml" > erpnext/erpnext-secrets-sealed.yaml

      - name: Commit and push
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add erpnext/erpnext-secrets-sealed.yaml
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore: reseal erpnext"
          git push
