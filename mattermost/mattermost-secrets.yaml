# Secret mattermost (oidc-client-secret / postgres-password / smtp-password) は
# Infisical (il.doany.io) が持ち、External Secrets Operator がフォルダ
# /mattermost/mattermost の中身をそのままキーにして作る。値の変更は Infisical 側で行う
# (README の Secret の項)。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mattermost
  namespace: mattermost
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: mattermost
  dataFrom:
    - find:
        path: /mattermost/mattermost
        name:
          regexp: .*
