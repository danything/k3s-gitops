apiVersion: apps/v1
kind: Deployment
metadata:
  name: vpn
  namespace: vpn
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vpn
  template:
    metadata:
      labels:
        app: vpn
    spec:
      hostNetwork: true
      containers:
        - name: vpn
          image: hwdsl2/ipsec-vpn-server:latest
          securityContext:
            privileged: true
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    sleep 5
                    sed -i '/config setup/a\  logfile=/tmp/pluto.log\n  plutodebug=all' /etc/ipsec.conf
                    ipsec whack --shutdown || true
                    sleep 1
                    ipsec pluto --config /etc/ipsec.conf
                    # VPNクライアント(192.168.43.0/24)から社内LAN(10.10.0.0/24, eno4)への
                    # forward/NATを許可。ipsec-vpn-serverの初期化スクリプトはデフォルトルート
                    # インターフェース(bond0)しか自動設定しないため、eno4宛は個別に追加する。
                    iptables -C FORWARD -s 192.168.43.0/24 -o eno4 -j ACCEPT 2>/dev/null || \
                      iptables -I FORWARD -s 192.168.43.0/24 -o eno4 -j ACCEPT
                    iptables -C FORWARD -d 192.168.43.0/24 -i eno4 -m state --state RELATED,ESTABLISHED -j ACCEPT 2>/dev/null || \
                      iptables -I FORWARD -d 192.168.43.0/24 -i eno4 -m state --state RELATED,ESTABLISHED -j ACCEPT
                    iptables -t nat -C POSTROUTING -s 192.168.43.0/24 -o eno4 -j MASQUERADE 2>/dev/null || \
                      iptables -t nat -A POSTROUTING -s 192.168.43.0/24 -o eno4 -j MASQUERADE

                    # IKEv2(ESP over UDP)はカプセル化オーバーヘッドで実効MTUが下がる
                    # (実測: クライアント側経路PMTU=1454、トンネル内実効MTU=1390)。
                    # --clamp-mss-to-pmtuはFORWARDチェーン通過時点でxfrm変換後の実効MTUを
                    # まだ参照できず1500基準でクランプしてしまい効果がなかったため、
                    # 実測値から十分マージンを取った固定MSSを強制する。
                    iptables -t mangle -D FORWARD -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --clamp-mss-to-pmtu 2>/dev/null || true
                    ip6tables -t mangle -D FORWARD -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --clamp-mss-to-pmtu 2>/dev/null || true
                    iptables -t mangle -C FORWARD -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --set-mss 1350 2>/dev/null || \
                      iptables -t mangle -A FORWARD -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --set-mss 1350
                    ip6tables -t mangle -C FORWARD -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --set-mss 1330 2>/dev/null || \
                      ip6tables -t mangle -A FORWARD -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --set-mss 1330
          env:
            - name: VPN_DNS_NAME
              value: v.doany.io
            - name: VPN_IKEV2_ONLY
              value: "yes"
            - name: VPN_DNS_SRV1
              value: 10.42.0.1
          volumeMounts:
            - name: vpn-data
              mountPath: /etc/ipsec.d
      volumes:
        - name: vpn-data
          persistentVolumeClaim:
            claimName: vpn-data
